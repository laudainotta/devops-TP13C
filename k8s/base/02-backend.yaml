apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: notes-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: laudainotta/notes-backend:tp13c
          imagePullPolicy: Always
          args: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--access-logfile", "-", "app:app"]
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres-svc.notes-app.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: APP_ENV
              value: production
          envFrom:
            - secretRef:
                name: notes-secret
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "384Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: notes-app
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
