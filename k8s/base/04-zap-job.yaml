apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zap-reports
  namespace: notes-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zap-scan
  namespace: notes-app
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: zap
          image: ghcr.io/zaproxy/zaproxy:stable
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              mkdir -p /zap/wrk/reports
              cp /zap/plan/zap-plan.yaml /zap/wrk/zap-plan.yaml
              echo "=== ZAP $(zap.sh -version 2>/dev/null | head -1) ==="
              echo "=== Iniciando Automation Framework ==="
              zap.sh -Xmx1600m -cmd -autorun /zap/wrk/zap-plan.yaml
              echo "=== Reportes generados ==="
              ls -lh /zap/wrk/reports
          volumeMounts:
            - { name: plan, mountPath: /zap/plan }
            - { name: reports, mountPath: /zap/wrk }
          resources:
            requests: { memory: "1Gi", cpu: "500m" }
            limits: { memory: "3584Mi", cpu: "2000m" }
      volumes:
        - name: plan
          configMap:
            name: zap-plan
        - name: reports
          persistentVolumeClaim:
            claimName: zap-reports
